<body data-page="people">
  <a class="skip" href="#main">Skip to content</a>
  <main id="main">
    <section class="nhero">
      <p class="eyebrow">Our people</p>
      <h1 data-split>The people <em>behind the work</em></h1>
      <div class="nhero__row">
        <p>A foundation is measured by the people it backs. These are some of the artists, scholars, athletes and communities we have supported since 2011.</p>
        <div class="nhero__links" id="pjump"></div>
      </div>
    </section>
    <div id="people"></div>
  </main>

  <footer class="footer" data-theme="dark" data-img="assets/img/events/delfina-visit-2026.jpg"></footer>

  <script src="https://cdnjs.cloudflare.com/ajax/libs/gsap/3.12.5/gsap.min.js"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/gsap/3.12.5/ScrollTrigger.min.js"></script>
  <script src="https://unpkg.com/lenis@1.1.13/dist/lenis.min.js"></script>
  <script src="js/data.js"></script>
  <script>
    const id = g => g.toLowerCase().replace(/[^a-z]+/g, "-");
    document.getElementById("pjump").innerHTML = RF.people.map(g => `<a class="link-dot" href="#${id(g.group)}">${g.group}</a>`).join("");
    document.getElementById("people").innerHTML = RF.people.map(g => `
      <section class="pgroup" id="${id(g.group)}">
        <h2 data-split>${g.group}</h2>
        <div class="pgrid">${g.items.map(([name, line, img, href]) => `
          <a class="person" href="${href}" data-reveal>
            <div class="person__img${img ? "" : " person__img--none"}">${img ? `<img src="${img}" alt="${name}" loading="lazy">` : `<span>${name.split(" ").map(w => w[0]).slice(0, 2).join("")}</span>`}</div>
            <h3>${name}</h3>
            <p>${line}</p>
          </a>`).join("")}
        </div>
      </section>`).join("");
  </script>
  <script src="js/main.js"></script>
</body>
</html>

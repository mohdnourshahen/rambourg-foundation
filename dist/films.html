  <script>
    const pad = n => String(n).padStart(2, "0");
    document.getElementById("findex").innerHTML = RF.films.map((f, i) => `<a href="#${f.slug}"><small>${pad(i + 1)}</small>${f.title}</a>`).join("");
    document.getElementById("films").innerHTML = RF.films.map((f, i) => `
      <section class="film dark" id="${f.slug}" data-theme="dark">
        <div class="film__poster${f.poster ? "" : " film__poster--type"}">
          ${f.poster ? `<img src="${f.poster}" alt="Poster: ${f.title}" loading="${i ? "lazy" : "eager"}">` : `<span>${f.title}</span>`}
        </div>
        <div class="film__body">
          <p class="film__meta"><span>${pad(i + 1)}</span>${[f.year, f.by && "by " + f.by].filter(Boolean).join(" · ")}</p>
          <h2>${f.title}</h2>
          <p class="film__role">${f.role}</p>
          ${f.honours.length ? `<ul class="film__honours">${f.honours.map(h => `<li>${h}</li>`).join("")}</ul>` : ""}
          <p class="film__text">${f.text}</p>
          ${f.stills.length ? `<div class="film__stills">${f.stills.map(([src, cap]) => `<figure><div><img src="${src}" alt="${cap}" loading="lazy"></div><figcaption>${cap}</figcaption></figure>`).join("")}</div>` : ""}
          ${f.news ? `<a class="btn btn--line btn--inv" href="journal/${f.news}/">Read the story</a>` : ""}
        </div>
      </section>`).join("");
  </script>
  <script src="js/main.js"></script>

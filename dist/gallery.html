<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Gallery: Our Projects in Photos — Rambourg Foundation</title>
  <meta name="description" content="Photographs from Rambourg Foundation projects and events: Jbel Semmama, Ksar Saïd, scholarships, tennis courts, festivals and London exhibitions.">
  <meta name="theme-color" content="#F7F4EE">
  <link rel="canonical" href="https://rambourg-foundation.com/gallery.html">
  <meta property="og:type" content="website">
  <meta property="og:site_name" content="Rambourg Foundation">
  <meta property="og:title" content="Gallery: Our Projects in Photos — Rambourg Foundation">
  <meta property="og:description" content="Photographs from Rambourg Foundation projects and events: Jbel Semmama, Ksar Saïd, scholarships, tennis courts, festivals and London exhibitions.">
  <meta property="og:url" content="https://rambourg-foundation.com/gallery.html">
  <meta property="og:image" content="https://rambourg-foundation.com/assets/img/p_cultural.jpg">
  <meta name="twitter:card" content="summary_large_image">
  <meta name="twitter:image" content="https://rambourg-foundation.com/assets/img/p_cultural.jpg">
  <link rel="icon" href="assets/logo/RF_LetterMark_C.svg" type="image/svg+xml">
  <link rel="icon" href="assets/logo/favicon-32.png" sizes="32x32">
  <link rel="apple-touch-icon" href="assets/logo/apple-touch-icon.png">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Work+Sans:wght@300..600&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="css/style.css">
  <link rel="preload" href="assets/fonts/RowanOakNF-Regular.woff2" as="font" type="font/woff2" crossorigin>
  <script type="application/ld+json" data-gen>{"@context": "https://schema.org", "@graph": [{"@type": "BreadcrumbList", "itemListElement": [{"@type": "ListItem", "position": 1, "name": "Home", "item": "https://rambourg-foundation.com/"}, {"@type": "ListItem", "position": 2, "name": "Gallery", "item": "https://rambourg-foundation.com/gallery.html"}]}]}</script>
</head>
<body data-page="gallery">
  <a class="skip" href="#main">Skip to content</a>
  <main id="main">
    <section class="ghead">
      <p class="eyebrow">Gallery</p>
      <h1 data-split>Moments from <em>our work</em></h1>
      <div class="ghead__row">
        <p>Photographs from our projects and events — from Jbel Semmama to the Ksar Saïd palace, from tennis courts to London stages.</p>
        <div class="filters" id="gfilters" role="group" aria-label="Filter photos"></div>
      </div>
    </section>
    <section class="gwall" id="gwall"></section>
  </main>

  <div class="lightbox" id="lightbox" role="dialog" aria-modal="true" aria-label="Photo viewer">
    <button class="lightbox__close" aria-label="Close">Close</button>
    <img alt="">
    <div class="lightbox__bar">
      <span class="lightbox__cap"></span>
      <div><button class="lightbox__prev" aria-label="Previous photo">←</button><button class="lightbox__next" aria-label="Next photo">→</button></div>
    </div>
  </div>

  <footer class="footer" data-theme="dark" data-img="assets/img/p_cultural.jpg"></footer>

  <script src="https://cdnjs.cloudflare.com/ajax/libs/gsap/3.12.5/gsap.min.js"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/gsap/3.12.5/ScrollTrigger.min.js"></script>
  <script src="https://unpkg.com/lenis@1.1.13/dist/lenis.min.js"></script>
  <script src="js/data.js"></script>
  <script src="js/gallery.js"></script>
  <script>
    document.getElementById("gwall").innerHTML = RF.gallery.map(([src, tag], i) =>
      `<button class="gitem" data-i="${i}" data-tag="${tag}" aria-label="Open photo: ${tag}"><img src="${src}" alt="${tag} — Rambourg Foundation project photo"${i > 11 ? ' loading="lazy"' : ""}><span>${tag}</span></button>`).join("");
    const tags = ["All", ...new Set(RF.gallery.map(g => g[1]))];
    document.getElementById("gfilters").innerHTML = tags.map((t, i) => `<button aria-pressed="${i === 0}" data-f="${t}">${t}</button>`).join("");
  </script>
  <script src="js/main.js"></script>
</body>
</html>

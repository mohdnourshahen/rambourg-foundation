<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>News — Rambourg Foundation</title>
  <meta name="description" content="The Rambourg Foundation supports artists, education and human rights. UK registered charity no. 1140347, founded in 2011.">
  <meta name="theme-color" content="#F7F4EE">
  <meta property="og:type" content="website">
  <meta property="og:site_name" content="Rambourg Foundation">
  <meta property="og:title" content="News — Rambourg Foundation">
  <meta property="og:description" content="The Rambourg Foundation supports artists, education and human rights. UK registered charity no. 1140347, founded in 2011.">
  <meta property="og:image" content="https://rambourg-foundation.com/assets/img/og-share.jpg">
  <meta name="twitter:card" content="summary_large_image">
  <link rel="icon" href="assets/logo/RF_LetterMark_C.svg" type="image/svg+xml">
  <link rel="icon" href="assets/logo/favicon-32.png" sizes="32x32">
  <link rel="apple-touch-icon" href="assets/logo/apple-touch-icon.png">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Work+Sans:wght@300..600&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="css/style.css">
  <link rel="preload" href="assets/fonts/RowanOakNF-Regular.woff2" as="font" type="font/woff2" crossorigin>
</head>
<body data-page="article">
  <a class="skip" href="#article">Skip to content</a>
  <main id="article"></main>
  <footer class="footer" data-theme="dark"></footer>

  <script src="https://cdnjs.cloudflare.com/ajax/libs/gsap/3.12.5/gsap.min.js"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/gsap/3.12.5/ScrollTrigger.min.js"></script>
  <script src="https://unpkg.com/lenis@1.1.13/dist/lenis.min.js"></script>
  <script src="js/data.js"></script>
  <script>
    // One template for every story: article.html?n=<slug>
    const slug = new URLSearchParams(location.search).get("n") || document.body.dataset.slug;
    const a = RF.news.find(n => n.slug === slug) || RF.news[0];
    const more = RF.news.filter(n => n !== a).slice(0, 3);
    const pil = RF.pillars.find(p => p.slug === a.pillar);
    if (!document.body.dataset.slug) document.title = `${a.title} — Rambourg Foundation`;  // pre-rendered pages keep their SEO title
    document.getElementById("article").innerHTML = `
      <header class="ahead">
        <p class="ahead__crumb"><a href="news.html">Journal</a><span>/</span><span>${a.cat}</span></p>
        <h1 data-split>${a.title}</h1>
        <p class="ahead__dek">${a.excerpt}</p>
        <p class="ahead__meta"><span>${a.cat}</span><span>${a.date}</span>${pil ? `<a class="tag" href="pillars/${pil.slug}/" style="--c:${pil.color}">${pil.name}</a>` : ""}</p>
      </header>

      <div class="hero__media" data-theme="dark">
        <div class="hero__frame"><img src="${a.img}" alt="${a.imgCap || ""}"></div>
      </div>
      ${a.imgCap ? `<p class="acap">${a.imgCap}</p>` : ""}

      <section class="abody">
        <aside class="abody__aside">
          <a class="link-dot" href="news.html">All news</a>
          <span>Share: <a href="mailto:?subject=${encodeURIComponent(a.title)}&body=${encodeURIComponent(location.href)}">Email</a></span>
        </aside>
        <div class="abody__text" data-reveal>${a.body.map(p => `<p>${p.replace(/\[(Draft[^\]]*)\]/g, '<span class="todo">$1</span>')}</p>`).join("")}
          ${a.quote ? `<blockquote class="aquote"><p>“${a.quote[0]}”</p><cite>${a.quote[1]}</cite></blockquote>` : ""}
          ${a.link ? `<p class="abody__link"><a class="btn btn--line" href="${a.link[1]}" target="_blank" rel="noopener">${a.link[0]}</a></p>` : ""}</div>
      </section>
      ${a.video ? `<section class="avideo"><figure class="work work--video"><div class="vplayer"><video src="${a.video[0]}" poster="${a.video[1]}" muted loop playsinline preload="none" aria-label="${a.video[2]}"></video><button class="vplayer__sound" aria-pressed="false">Sound on</button></div><figcaption>${a.video[2]}<small>${a.video[3]}</small></figcaption></figure></section>` : ""}
      ${a.photos ? `<section class="aphotos"><h2 data-split>At the <em>exhibition</em></h2><div class="aphotos__grid">${a.photos.map(([src, cap]) => `<figure class="work" data-reveal><div class="work__img"><img src="${src}" alt="${cap}" loading="lazy"></div><figcaption>${cap}<small>Christie's London, July 2025</small></figcaption></figure>`).join("")}</div></section>` : ""}
      ${a.youtube ? `<section class="ayt"><div class="yt" data-id="${a.youtube[0]}" data-start="${a.youtube[1]}"><img src="https://i.ytimg.com/vi/${a.youtube[0]}/maxresdefault.jpg" alt="" loading="lazy"><button class="yt__play" aria-label="Play: ${a.youtube[2]}"><span></span></button></div><p class="ayt__cap">${a.youtube[2]}<small>${a.youtube[3]}</small></p></section>` : ""}
      ${a.gallery ? `<section class="agallery">
        <h2 data-split>From the <em>exhibition</em></h2>
        <div class="agallery__grid">${RF[a.gallery].map(([src, title, credit]) => `<figure class="work" data-reveal><div class="work__img"><img src="${src}" alt="${title}" loading="lazy"></div><figcaption>${title}<small>${credit}</small></figcaption></figure>`).join("")}</div>
      </section>` : ""}

      <section class="news">
        <div class="news__head"><h2 data-split>More from the <em>journal</em></h2><a class="btn btn--line" href="news.html">The journal</a></div>
        <div class="news__grid">${more.map(n => `
          <a class="ncard" href="journal/${n.slug}/" data-reveal>
            <div class="ncard__img"><img src="${n.img}" alt="${n.title}" loading="lazy"></div>
            <div class="ncard__meta"><span>${n.cat}</span><span>${n.date}</span></div>
            <h3><span>${n.title}</span></h3>
          </a>`).join("")}
        </div>
      </section>`;
  </script>
  <script src="js/main.js"></script>
</body>
</html>

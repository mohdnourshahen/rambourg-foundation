server {
  listen 8080;
  server_name _;
  root /usr/share/nginx/html;
  index index.html;
  charset utf-8;

  gzip on;
  gzip_types text/css application/javascript application/json image/svg+xml application/xml text/plain;
  gzip_min_length 1024;

  error_page 404 /404.html;

  # old WordPress addresses and retired pages (same as _redirects)
  rewrite ^/(arts|cultural-activities|festivals|education|scholarships|human-rights|entrepreneurship|sport)/?$ /pillars/$1/ permanent;
  rewrite ^/craftsmanship-2/?$ /pillars/craftsmanship/ permanent;
  rewrite ^/guillaume-rambourg/?$ /leadership.html permanent;
  location = /guillaume.html { return 301 /leadership.html; }
  location = /pillar.html  { if ($arg_p) { return 301 /pillars/$arg_p/; } try_files $uri =404; }
  location = /article.html { if ($arg_n) { return 301 /journal/$arg_n/; } try_files $uri =404; }

  # pages: always fresh
  location / {
    try_files $uri $uri/ =404;
    add_header Cache-Control "no-cache";
    add_header X-Content-Type-Options nosniff always;
    add_header Referrer-Policy strict-origin-when-cross-origin always;
    add_header X-Frame-Options SAMEORIGIN always;
  }

  # images, fonts, video, css, js: cache for a week
  location ~* \.(jpg|jpeg|png|webp|svg|woff2|otf|mp4|css|js)$ {
    expires 7d;
    add_header Cache-Control "public";
    add_header X-Content-Type-Options nosniff always;
    add_header Referrer-Policy strict-origin-when-cross-origin always;
    add_header X-Frame-Options SAMEORIGIN always;
    try_files $uri =404;
  }
}
